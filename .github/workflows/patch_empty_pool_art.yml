name: Patch Empty Pool Artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch_empty_pool_art.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace courier offline and empty pool states with assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/courier_home_page.dart')
          s = p.read_text()

          old_offline = """  Widget _offlineState(double s) => Center(child: Padding(padding: EdgeInsets.all(28*s), child: Column(mainAxisSize: MainAxisSize.min, children: [Icon(Icons.power_settings_new_rounded, color: muted, size: 42*s), SizedBox(height: 10*s), Text('İş havuzunu görmek için Online ol', style: TextStyle(color: navy, fontSize: 14*s, fontWeight: FontWeight.w900)), SizedBox(height: 5*s), Text('Online olduğunda açık gönderiler burada anında görünür.', textAlign: TextAlign.center, style: TextStyle(color: muted, fontSize: 10*s))])));"""
          new_offline = """  Widget _offlineState(double s) => LayoutBuilder(
    builder: (context, constraints) => SizedBox.expand(
      child: Image.asset(
        'assets/images/Ofline.png',
        fit: BoxFit.contain,
        alignment: Alignment.bottomCenter,
        filterQuality: FilterQuality.high,
      ),
    ),
  );"""

          old_empty = """  Widget _emptyPool(double s) => Center(child: Padding(padding: EdgeInsets.all(28*s), child: Column(mainAxisSize: MainAxisSize.min, children: [Icon(Icons.layers_outlined, color: muted, size: 42*s), SizedBox(height: 10*s), Text('Şu anda havuzda iş yok', style: TextStyle(color: navy, fontSize: 14*s, fontWeight: FontWeight.w900)), SizedBox(height: 5*s), Text('Yeni gönderi geldiğinde burada otomatik görünecek.', style: TextStyle(color: muted, fontSize: 10*s))])));"""
          new_empty = """  Widget _emptyPool(double s) => LayoutBuilder(
    builder: (context, constraints) => SizedBox.expand(
      child: Image.asset(
        'assets/images/Bos.png',
        fit: BoxFit.contain,
        alignment: Alignment.bottomCenter,
        filterQuality: FilterQuality.high,
      ),
    ),
  );"""

          changed = False
          if old_offline in s:
              s = s.replace(old_offline, new_offline)
              changed = True
          if old_empty in s:
              s = s.replace(old_empty, new_empty)
              changed = True
          if not changed:
              raise SystemExit('No matching state blocks found')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/courier_home_page.dart
          git commit -m "Use empty pool artwork on courier home"
          git push
# trigger
