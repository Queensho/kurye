name: Patch Customer Production

on:
  push:
    paths:
      - '.github/workflows/patch_customer_production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch customer production flows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/customer_profile_page.dart')
          s = p.read_text()
