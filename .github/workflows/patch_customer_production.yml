  void _updateRouteEta(int? eta, double? km) {
    final sameEta = routeEtaMin == eta;
    final sameKm = (routeDistanceKm == null && km == null) ||
        (routeDistanceKm != null && km != null && (routeDistanceKm! - km).abs() < .05);
    if (!mounted || (sameEta && sameKm)) return;
    setState(() {
