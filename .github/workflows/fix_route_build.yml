name: Fix Route Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer production flows
        run: |
          python3 .github/scripts/customer_production_patch.py
          dart format lib/customer_profile_page.dart lib/customer_create_shipment_page_v3.dart lib/shipment_details_step_page.dart lib/customer_live_tracking_page.dart || true
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/customer_profile_page.dart lib/customer_create_shipment_page_v3.dart lib/shipment_details_step_page.dart lib/customer_live_tracking_page.dart
          git commit -m "Complete customer address support route UX"
          git push
