name: Fix Route Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch known compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/courier_assigned_jobs_page.dart')
          s = p.read_text()
          needle = "  static const navy = Color(0xFF171052);\n"
          if "static const purple" not in s:
              s = s.replace(needle, needle + "  static const purple = Color(0xFF2B1776);\n")
          p.write_text(s)

          p = Path('lib/courier_active_job_page.dart')
          s = p.read_text()
          s = s.replace(
              "  Widget _addressCard(String title,String address,Color color,{required VoidCallback onRoute})=>Container(\n    minHeight: 80,",
              "  Widget _addressCard(String title,String address,Color color,{required VoidCallback onRoute})=>Container(\n    constraints: const BoxConstraints(minHeight: 80),",
          )
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/courier_assigned_jobs_page.dart lib/courier_active_job_page.dart
          git commit -m "Fix route feature build"
          git push
