name: Patch Offline Hero
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch_offline_hero.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace offline text state with asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/courier_home_page.dart')
          s=p.read_text()
          old="""  Widget _offlineState(double s) => Center(child: Padding(padding: EdgeInsets.all(28*s), child: Column(mainAxisSize: MainAxisSize.min, children: [Icon(Icons.power_settings_new_rounded, color: muted, size: 42*s), SizedBox(height: 10*s), Text('İş havuzunu görmek için Online ol', style: TextStyle(color: navy, fontSize: 14*s, fontWeight: FontWeight.w900)), SizedBox(height: 5*s), Text('Online olduğunda açık gönderiler burada anında görünür.', textAlign: TextAlign.center, style: TextStyle(color: muted, fontSize: 10*s))])));"""
          new="""  Widget _offlineState(double s) => LayoutBuilder(
    builder: (context, constraints) {
      return SizedBox.expand(
        child: Align(
          alignment: Alignment.bottomCenter,
          child: SizedBox(
            width: constraints.maxWidth,
            height: constraints.maxHeight,
            child: Image.asset(
              'assets/images/Ofline.png',
              fit: BoxFit.contain,
              alignment: Alignment.bottomCenter,
              filterQuality: FilterQuality.high,
            ),
          ),
        ),
      );
    },
  );"""
          if old not in s:
              raise SystemExit('offline block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/courier_home_page.dart
          git commit -m "Use offline illustration on courier home"
          git push
