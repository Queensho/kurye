name: Wire Compact Courier Chat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use courier-specific compact chat
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/courier_active_job_realtime_page.dart')
          s = p.read_text()
          original = s
          s = s.replace("import 'shipment_chat_page.dart';", "import 'courier_shipment_chat_page.dart';")
          s = s.replace(
              "builder: (_) => ShipmentChatPage(\n          shipmentId: widget.shipmentId,\n          title: 'Müşteri',\n        ),",
              "builder: (_) => CourierShipmentChatPage(\n          shipmentId: widget.shipmentId,\n        ),",
          )
          if s == original:
              raise SystemExit('No matching courier chat code found')
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/courier_active_job_realtime_page.dart
          git commit -m "Use compact purple courier package chat"
          git push
