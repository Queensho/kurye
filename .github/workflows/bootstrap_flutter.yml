name: Bootstrap Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message || '', '[bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Flutter platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name kurye --org com.queensho .
          fi

      - name: Restore custom app files
        run: |
          git checkout HEAD -- lib/main.dart pubspec.yaml assets/images/.gitkeep
          flutter pub get

      - name: Commit generated project files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "[bootstrap] Flutter Android proje iskeletini oluştur"
            git push
          fi
