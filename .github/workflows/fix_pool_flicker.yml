name: Fix Courier Pool Flicker

on:
  push:
    paths:
      - '.github/workflows/fix_pool_flicker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep one stable pool stream for the page lifetime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/courier_home_page.dart')
          s = p.read_text()

          old = "  List<Map<String, dynamic>> courierShipments = [];\n\n  @override\n  void initState() {\n    super.initState();\n    _loadDashboard();\n  }"
          new = "  List<Map<String, dynamic>> courierShipments = [];\n  late final Stream<List<Map<String, dynamic>>> poolStream;\n\n  @override\n  void initState() {\n    super.initState();\n    poolStream = data.watchCourierPool();\n    _loadDashboard();\n  }"
          if old not in s:
              raise SystemExit('initState target not found')
          s = s.replace(old, new, 1)

          old_stream = "                    stream: data.watchCourierPool(),"
          new_stream = "                    stream: poolStream,"
          if old_stream not in s:
              raise SystemExit('StreamBuilder target not found')
          s = s.replace(old_stream, new_stream, 1)

          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/courier_home_page.dart
          git commit -m "Fix courier pool cards flickering" || exit 0
          git push origin main
