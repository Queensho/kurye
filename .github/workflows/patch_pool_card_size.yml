name: Patch Pool Card Size
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch_pool_card_size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge only pool job cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/courier_job_pool_page.dart')
          s = p.read_text()
          old = s
          replacements = {
            "margin: const EdgeInsets.only(bottom: 12),\n      padding: const EdgeInsets.all(14),": "margin: const EdgeInsets.only(bottom: 14),\n      padding: const EdgeInsets.all(16),",
            "borderRadius: BorderRadius.circular(24),\n        boxShadow: const [BoxShadow(color: Color(0x0E000000), blurRadius: 16, offset: Offset(0, 5))],": "borderRadius: BorderRadius.circular(26),\n        boxShadow: const [BoxShadow(color: Color(0x0E000000), blurRadius: 16, offset: Offset(0, 5))],",
            "const CircleAvatar(radius: 25, backgroundColor: Color(0xFFEAF4FF), child: Icon(Icons.description_outlined, color: blue)),": "const CircleAvatar(radius: 28, backgroundColor: Color(0xFFEAF4FF), child: Icon(Icons.description_outlined, color: blue, size: 28)),",
            "Text(code, style: const TextStyle(color: navy, fontSize: 17, fontWeight: FontWeight.w900)),": "Text(code, style: const TextStyle(color: navy, fontSize: 18, fontWeight: FontWeight.w900)),",
            "padding: const EdgeInsets.symmetric(vertical: 10),\n            decoration: BoxDecoration(color: const Color(0xFFF0F7FF), borderRadius: BorderRadius.circular(17)),": "padding: const EdgeInsets.symmetric(vertical: 12),\n            decoration: BoxDecoration(color: const Color(0xFFF0F7FF), borderRadius: BorderRadius.circular(18)),",
            "minimumSize: const Size.fromHeight(50),": "minimumSize: const Size.fromHeight(54),",
            "Expanded(child: Text(text, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Color(0xFF5E7085), fontSize: 11))),": "Expanded(child: Text(text, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Color(0xFF5E7085), fontSize: 12))),",
          }
          for a,b in replacements.items():
            if a not in s:
              raise SystemExit(f'expected snippet not found: {a[:80]}')
            s = s.replace(a,b,1)
          if s == old:
            raise SystemExit('no changes')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/courier_job_pool_page.dart
          git commit -m "Slightly enlarge courier pool job cards"
          git push
