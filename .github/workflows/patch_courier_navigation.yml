name: Patch Courier Navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch_courier_navigation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch courier navigation and sizing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # HOME
          p = Path('lib/courier_home_page.dart')
          s = p.read_text()
          s = s.replace("import 'courier_earnings_page.dart';\nimport 'courier_job_pool_page.dart';\nimport 'courier_profile_page.dart';", "import 'courier_assigned_jobs_page.dart';\nimport 'courier_bottom_nav.dart';\nimport 'courier_earnings_page.dart';\nimport 'courier_profile_page.dart';")
          s = re.sub(r"  void _openAssigned\(\) \{.*?\n  \}\n\n  @override", "  void _openAssigned() {\n    Navigator.of(context).push(MaterialPageRoute(builder: (_) => const CourierAssignedJobsPage()));\n  }\n\n  void _navigateBottom(int index) {\n    if (index == 0) return;\n    final page = switch (index) {\n      1 => const CourierAssignedJobsPage(),\n      2 => const CourierEarningsPage(),\n      3 => const CourierProfilePage(),\n      _ => const CourierHomePage(),\n    };\n    Navigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) => page));\n  }\n\n  @override", s, flags=re.S)
          s = s.replace("final s = (constraints.maxWidth / 390).clamp(.90, 1.06).toDouble();", "final s = (constraints.maxWidth / 390).clamp(.92, 1.08).toDouble();")
          s = re.sub(r"  Widget _bottomNav\(double s\) => Container\(.*?\n  Widget _nav\(.*?\n\}", "  Widget _bottomNav(double s) => CourierBottomNav(currentIndex: 0, onTap: _navigateBottom);\n}", s, flags=re.S)
          p.write_text(s)

          # EARNINGS
          p = Path('lib/courier_earnings_page.dart')
          s = p.read_text()
          if "courier_bottom_nav.dart" not in s:
            s = s.replace("import 'data/app_data_service.dart';", "import 'courier_assigned_jobs_page.dart';\nimport 'courier_bottom_nav.dart';\nimport 'courier_home_page.dart';\nimport 'courier_profile_page.dart';\nimport 'data/app_data_service.dart';")
          s = s.replace("final s=(c.maxWidth/390).clamp(.90,1.08).toDouble();", "final s=(c.maxWidth/390).clamp(.92,1.08).toDouble();")
          s = re.sub(r"  Widget _bottom\(double s\)=>Container\(.*?\n  Widget _nav\(.*?\n\}", "  void _navigateBottom(int index) {\n    if (index == 2) return;\n    final page = switch (index) {\n      0 => const CourierHomePage(),\n      1 => const CourierAssignedJobsPage(),\n      3 => const CourierProfilePage(),\n      _ => const CourierEarningsPage(),\n    };\n    Navigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) => page));\n  }\n\n  Widget _bottom(double s)=>CourierBottomNav(currentIndex:2,onTap:_navigateBottom);\n}", s, flags=re.S)
          p.write_text(s)

          # PROFILE
          p = Path('lib/courier_profile_page.dart')
          s = p.read_text()
          if "courier_bottom_nav.dart" not in s:
            s = s.replace("import 'courier_earnings_page.dart';", "import 'courier_assigned_jobs_page.dart';\nimport 'courier_bottom_nav.dart';\nimport 'courier_earnings_page.dart';\nimport 'courier_home_page.dart';")
          s = re.sub(r"  Widget _bottomNav\(double s\) => Container\(.*?\n  Widget _nav\(.*?\n\}\n\nclass CourierProfileEditPage", "  void _navigateBottom(int index) {\n    if (index == 3) return;\n    final page = switch (index) {\n      0 => const CourierHomePage(),\n      1 => const CourierAssignedJobsPage(),\n      2 => const CourierEarningsPage(),\n      _ => const CourierProfilePage(),\n    };\n    Navigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) => page));\n  }\n\n  Widget _bottomNav(double s) => CourierBottomNav(currentIndex: 3, onTap: _navigateBottom);\n}\n\nclass CourierProfileEditPage", s, flags=re.S)
          p.write_text(s)

          # MAIN: direct /havuz to the unified courier home and add /atananlar.
          p = Path('lib/main.dart')
          s = p.read_text()
          if "courier_assigned_jobs_page.dart" not in s:
            s = s.replace("import 'courier_auth_gate.dart';", "import 'courier_assigned_jobs_page.dart';\nimport 'courier_auth_gate.dart';")
          s = s.replace("  bool get isCourierProfilePath =>", "  bool get isAssignedPath => path.contains('/atananlar') || path.contains('/assigned');\n  bool get isCourierProfilePath =>")
          s = s.replace("    } else if (isJobPoolPath) {\n      home = _courierGate(const FixedNotificationBellOverlay(audience: 'courier', child: CourierJobPoolPage()));\n    } else if (isCourierEarningsPath) {", "    } else if (isAssignedPath) {\n      home = _courierGate(const FixedNotificationBellOverlay(audience: 'courier', child: CourierAssignedJobsPage()));\n    } else if (isJobPoolPath) {\n      home = _courierGate(const FixedNotificationBellOverlay(audience: 'courier', embeddedCourierHome: true, child: CourierHomePage()));\n    } else if (isCourierEarningsPath) {")
          p.write_text(s)
          PY
      - name: Format and verify
        run: |
          dart format lib/courier_bottom_nav.dart lib/courier_assigned_jobs_page.dart lib/courier_home_page.dart lib/courier_earnings_page.dart lib/courier_profile_page.dart lib/main.dart
          flutter pub get
          flutter analyze lib/courier_bottom_nav.dart lib/courier_assigned_jobs_page.dart lib/courier_home_page.dart lib/courier_earnings_page.dart lib/courier_profile_page.dart lib/main.dart
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/courier_bottom_nav.dart lib/courier_assigned_jobs_page.dart lib/courier_home_page.dart lib/courier_earnings_page.dart lib/courier_profile_page.dart lib/main.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Unify courier navigation and responsive sizing'
            git push
          fi
