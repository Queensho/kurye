name: Add Shipment Chat To Courier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch courier shipment chat button
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/courier_active_job_realtime_page.dart')
          s = p.read_text()
          original = s

          if "import 'shipment_chat_page.dart';" not in s:
              s = s.replace(
                  "import 'data/app_data_service.dart';\n",
                  "import 'data/app_data_service.dart';\nimport 'shipment_chat_page.dart';\n",
                  1,
              )

          if "void _openShipmentChat()" not in s:
              marker = "  Future<bool> _confirm(String title, String action) async =>\n"
              method = """  void _openShipmentChat() {\n    Navigator.of(context).push(\n      MaterialPageRoute(\n        builder: (_) => ShipmentChatPage(\n          shipmentId: widget.shipmentId,\n          title: 'Müşteri',\n        ),\n      ),\n    );\n  }\n\n"""
              if marker not in s:
                  raise SystemExit('confirm marker not found')
              s = s.replace(marker, method + marker, 1)

          old = """                IconButton(\n                  onPressed: () {},\n                  icon: const Icon(Icons.more_vert_rounded, color: Colors.white, size: 26),\n                ),\n"""
          new = """                IconButton(\n                  tooltip: 'Mesaj',\n                  onPressed: cancelled ? null : _openShipmentChat,\n                  icon: const Icon(Icons.chat_bubble_rounded, color: Colors.white, size: 24),\n                ),\n"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "tooltip: 'Mesaj'" not in s:
              raise SystemExit('header action marker not found')

          if s == original:
              print('No changes needed')
          else:
              p.write_text(s)
              print('Patched courier_active_job_realtime_page.dart')

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/courier_active_job_realtime_page.dart
          git commit -m "Add shipment chat button for courier"
          git push
