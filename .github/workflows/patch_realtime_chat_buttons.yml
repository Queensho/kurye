name: Patch Realtime Chat Buttons

on:
  push:
    paths:
      - '.github/workflows/patch_realtime_chat_buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer and courier chat buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/customer_assigned_courier_page.dart')
          s = p.read_text()
          if "import 'shipment_chat_page.dart';" not in s:
              s = s.replace("import 'data/app_data_service.dart';", "import 'data/app_data_service.dart';\nimport 'shipment_chat_page.dart';")
          old = """                  if (phone != null && phone.isNotEmpty) IconButton.filled(onPressed: () {}, icon: const Icon(Icons.phone_rounded)),"""
          new = """                  IconButton.filledTonal(
                    tooltip: 'Mesaj Gönder',
                    onPressed: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => ShipmentChatPage(shipmentId: widget.shipmentId, title: name))),
                    icon: const Icon(Icons.chat_bubble_rounded),
                  ),
                  if (phone != null && phone.isNotEmpty) const SizedBox(width: 6),
                  if (phone != null && phone.isNotEmpty) IconButton.filled(onPressed: () {}, icon: const Icon(Icons.phone_rounded)),"""
          if old not in s:
              raise SystemExit('customer courier action row not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/courier_active_job_page.dart')
          s = p.read_text()
          if "import 'shipment_chat_page.dart';" not in s:
              s = s.replace("import 'data/app_data_service.dart';", "import 'data/app_data_service.dart';\nimport 'shipment_chat_page.dart';")
          old = """          appBar: AppBar(
            backgroundColor: Colors.white,
            surfaceTintColor: Colors.white,
            title: Text(code, style: const TextStyle(color: navy, fontWeight: FontWeight.w900)),
          ),"""
          new = """          appBar: AppBar(
            backgroundColor: Colors.white,
            surfaceTintColor: Colors.white,
            title: Text(code, style: const TextStyle(color: navy, fontWeight: FontWeight.w900)),
            actions: [
              IconButton(
                tooltip: 'Müşteriye Mesaj',
                onPressed: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => ShipmentChatPage(shipmentId: id, title: 'Müşteri'))),
                icon: const Icon(Icons.chat_bubble_rounded, color: blue),
              ),
            ],
          ),"""
          if old not in s:
              raise SystemExit('courier appbar block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/customer_assigned_courier_page.dart lib/courier_active_job_page.dart
          git commit -m "Connect customer courier realtime chat" || exit 0
          git push
