name: Patch Profile 3D Hero
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch_profile3d.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Profil3d in courier profile hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/courier_profile_page.dart')
          s = p.read_text()
          old = "Positioned(left: -22 * s, bottom: -16 * s, width: 300 * s, height: 260 * s, child: Image.asset('assets/images/Ofline.png', fit: BoxFit.cover, alignment: Alignment.bottomLeft)),"
          new = "Positioned(left: -22 * s, bottom: -16 * s, width: 300 * s, height: 260 * s, child: Image.asset('assets/images/Profil3d.png', fit: BoxFit.contain, alignment: Alignment.bottomLeft, filterQuality: FilterQuality.high)),"
          if old not in s:
              raise SystemExit('profile hero asset block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit profile hero update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/courier_profile_page.dart
          git commit -m "Use Profil3d in courier profile hero"
          git push
