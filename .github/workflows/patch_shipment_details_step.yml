name: Patch Shipment Details Step

on:
  push:
    paths:
      - '.github/workflows/patch_shipment_details_step.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer create shipment flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/customer_create_shipment_page.dart')
          s = p.read_text()
          imp = "import 'shipment_details_step_page.dart';\n"
          if imp not in s:
              s = s.replace("import 'data/app_data_service.dart';\n", "import 'data/app_data_service.dart';\n" + imp)
          old = "onPressed: creating ? null : _create,"
          new = """onPressed: creating ? null : () async {
        if (pickup == null) {
          await _pickAddress(true);
          return;
        }
        if (dropoff == null) {
          await _pickAddress(false);
          return;
        }
        if (!ready) {
          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Adres ve fiyat bilgilerini tamamlayın.')));
          return;
        }
        if (payment == 1 && selectedCardId == null) {
          await _chooseCard();
          if (selectedCardId == null) return;
        }
        if (!mounted) return;
        Navigator.of(context).push(MaterialPageRoute(builder: (_) => ShipmentDetailsStepPage(
          pickup: pickup!,
          dropoff: dropoff!,
          packageIndex: package,
          paymentIndex: payment,
          selectedCardId: selectedCardId,
          distanceKm: distanceKm!,
          durationMin: durationMin!,
          quotedPrice: quotedPrice!,
          initialWeight: weight,
          initialSize: size,
        )));
      },"""
          if old not in s:
              raise SystemExit('target onPressed not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/customer_create_shipment_page.dart
          git diff --cached --quiet && exit 0
          git commit -m "Open shipment details step after customer info"
          git push
