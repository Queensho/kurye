name: Patch Customer Palette Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_customer_palette_once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace legacy blue customer address palette
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/address_picker_page.dart')
          s = p.read_text()
          replacements = {
              'static const blue = Color(0xFF168CF5);': 'static const blue = Color(0xFFFF5A1F);',
              'static const navy = Color(0xFF10182D);': 'static const navy = Color(0xFF171052);',
              'backgroundColor: const Color(0xFFF7FBFF),': 'backgroundColor: const Color(0xFFF7F7FA),',
              'fillColor: const Color(0xFFF2F7FD),': 'fillColor: const Color(0xFFF3F1FA),',
              'disabledBackgroundColor: const Color(0xFFB7C7D8),': 'disabledBackgroundColor: const Color(0xFFD8D6E2),',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch_customer_palette_once.yml
          git add lib/address_picker_page.dart
          git commit -m 'Match customer address picker to orange navy palette'
          git push
