name: Patch Pool Job Details
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch_pool_job_details.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch courier pool card navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/courier_home_page.dart')
          s = p.read_text()
          imp = "import 'courier_pool_job_detail_page.dart';\n"
          if imp not in s:
              s = s.replace("import 'courier_profile_page.dart';\n", "import 'courier_profile_page.dart';\n" + imp)
          old = "child: _jobCard(jobs[i], i, s),"
          new = "child: GestureDetector(\n                            behavior: HitTestBehavior.opaque,\n                            onTap: () async {\n                              final claimed = await Navigator.of(context).push<bool>(\n                                MaterialPageRoute(\n                                  builder: (_) => CourierPoolJobDetailPage(shipment: jobs[i]),\n                                ),\n                              );\n                              if (claimed == true) await _loadDashboard();\n                            },\n                            child: _jobCard(jobs[i], i, s),\n                          ),"
          if old not in s:
              raise SystemExit('job card call pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/courier_home_page.dart
            git commit -m "Open pool shipment details from job cards"
            git push
          fi
