name: Flutter Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure web platform exists
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name kurye --org com.queensho .
          fi

      - name: Restore app files
        run: |
          git checkout HEAD -- lib/main.dart pubspec.yaml assets/images/.gitkeep

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /kurye/ --dart-define=LOCATIONIQ_API_KEY=${{ secrets.LOCATIONIQ_API_KEY }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
