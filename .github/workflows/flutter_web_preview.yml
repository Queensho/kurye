name: Flutter Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure web platform exists
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name kurye --org com.queensho .
          fi

      - name: Restore app files
        run: |
          git checkout HEAD -- lib/main.dart pubspec.yaml assets/images/.gitkeep

      - name: Apply Google-like OSM map style
        run: |
          find lib -name '*.dart' -type f -print0 | xargs -0 sed -i 's#https://tile.openstreetmap.org/{z}/{x}/{y}.png#https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png#g'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /kurye/ --dart-define=LOCATIONIQ_API_KEY=${{ secrets.LOCATIONIQ_API_KEY }}

      - name: Publish customer entry paths
        run: |
          mkdir -p 'build/web/müsteri' 'build/web/müşteri' build/web/musteri
          cp build/web/index.html 'build/web/müsteri/index.html'
          cp build/web/index.html 'build/web/müşteri/index.html'
          cp build/web/index.html build/web/musteri/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
