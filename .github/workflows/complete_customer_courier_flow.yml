name: Complete Customer Courier Flow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch flow
        run: python3 .github/scripts/complete_flow.py
      - name: Format files
        run: |
          dart format lib/courier_home_page.dart lib/courier_assigned_jobs_page.dart lib/courier_search_page.dart lib/customer_assigned_courier_page.dart || true
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/courier_home_page.dart lib/courier_assigned_jobs_page.dart lib/courier_search_page.dart lib/customer_assigned_courier_page.dart
          if ! git diff --cached --quiet; then
            git commit -m "Complete customer courier realtime flow"
            git push
          fi
